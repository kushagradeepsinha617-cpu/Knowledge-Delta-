[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-delta"
version = "0.1.0"
description = "Evidence-first testing of documentation changes"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
knowledge-delta = "knowledge_delta.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_delta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
